[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # erros de formatação
    "W",   # avisos de formatação
    "F",   # erros de pyflakes
    "I",   # ordenação de importações
    "B",   # bugs comuns (flake8-bugbear)
    "UP",  # modernizações de sintaxe
    "SIM", # simplificações
    "C4",  # comprehensions
    "RET", # retornos desnecessários
    "PTH", # uso de pathlib
    "ARG", # argumentos não utilizados
    "RUF", # regras específicas do ruff
]
ignore = [
    "SIM108", # ternário nem sempre é mais legível
    "RET504", # atribuição antes do return facilita depuração
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
# O texto do prompt meta é conteúdo do experimento: não pode ser quebrado por limite de linha.
"src/meta_prompt_benchmark/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["meta_prompt_benchmark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
